[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guitar-transcription"
version = "0.1.0"
description = "Multimodal automatic guitar transcription: audio (and later video) to notation and tablature."
readme = "README.md"
# Upper bound: Basic Pitch 0.4.0 pins tensorflow<2.15.1, whose wheels stop at Python 3.11.
# Lower bound: music21 10.x requires Python >= 3.11. See PLAN.md "Decision log".
requires-python = ">=3.11,<3.12"
dependencies = [
    "music21>=10.5,<11",
]

[project.scripts]
guitar-transcribe = "guitar_transcription.cli:main"

[project.optional-dependencies]
# Audio transcription backend; imported only by audio/backends/basic_pitch.py. Pulls in TensorFlow 2.15.
basic-pitch = [
    # Exact pin: the adapter depends on predict()'s return structure (verified for 0.4.0).
    "basic-pitch==0.4.0",
    # basic-pitch pins resampy<0.4.3, which imports pkg_resources; setuptools 82 removed it.
    "setuptools<82",
]
# Automatic tempo estimation; imported only by rhythm/backends/librosa_tempo.py.
# <1.0: librosa 1.x needs Python >= 3.12 and numpy >= 2, incompatible with the Basic Pitch stack.
tempo = [
    "librosa>=0.10,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/ mirror the package layout without __init__.py files or name clashes.
# Integration tests (real model inference) are opt-in: `pytest -m integration`.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not integration"]
xfail_strict = true
markers = [
    "integration: real models or external resources (slow); opt in with -m integration; skips if missing",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true

# Optional backends are imported lazily by their adapters and ship no type information.
[[tool.mypy.overrides]]
module = ["basic_pitch", "basic_pitch.*", "librosa", "librosa.*", "lxml", "lxml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Keep hand-aligned code sketches in PLAN.md/README.md untouched; only format Python sources.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
